<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Legal Information | Logoto Discord Bot</title>
    <meta name="description" content="Terms of Service (ToS) and Privacy Policy for the Logoto Discord Bot.">
    <link rel="canonical" href="https://logoto.onrender.com/en/legal">

    <!-- Directives Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">

    <!-- Multilingual Links (Hreflang) -->
    <link rel="alternate" hreflang="en" href="https://logoto.onrender.com/en/legal">
    <link rel="alternate" hreflang="fr" href="https://logoto.onrender.com/fr/legal">
    <link rel="alternate" hreflang="x-default" href="https://logoto.onrender.com/en/legal">

    <!-- Open Graph (Discord, Facebook, LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Logoto">
    <meta property="og:url" content="https://logoto.onrender.com/en/legal">
    <meta property="og:title" content="Legal Information | Logoto Discord Bot">
    <meta property="og:description" content="Terms of Service (ToS) and Privacy Policy for the Logoto Discord Bot.">
    <meta property="og:image" content="https://raw.githubusercontent.com/kanooob/logoto-web/refs/heads/main/icon.png">
    <meta property="og:image:alt" content="Logoto Official Logo">
    <meta property="og:locale" content="en_US">
    <meta name="theme-color" content="#8c935d">

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Legal Information | Logoto Discord Bot">
    <meta name="twitter:description" content="Terms of Service (ToS) and Privacy Policy for the Logoto Discord Bot.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/kanooob/logoto-web/refs/heads/main/icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kanooob/logoto-web/refs/heads/main/icon.png">

    <!-- Structured Data Schema.org (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Legal Information - Logoto",
      "url": "https://logoto.onrender.com/en/legal",
      "description": "Terms of Service and Privacy Policy for the Logoto Discord Bot.",
      "inLanguage": "en-US"
    }
    </script>

    <style>
        :root {
            --blanc: #F2F3F5;
            --vert-olive: #8c935d;
            --vert-olive-dark: #767d4f;
            --vert-olive-clair: #a3ab72;
            --gris-discord: #36393f; 
            --gris-footer: #2f3136;
            --gris-item: #3a3d42;
            --gris-code: #484c52;
            --note-bg: #3c3a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--gris-discord);
            color: var(--blanc);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .logo-container:hover .logo-img {
            transform: rotate(15deg) scale(1.05);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
        }

        .lang-container {
            position: relative;
            display: inline-block;
        }

        .lang-select {
            background: none;
            border: none;
            color: var(--blanc);
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            padding: 10px 5px;
            text-decoration: none;
        }

        .lang-dropdown {
            opacity: 0;
            visibility: hidden;
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(5px);
            background-color: var(--gris-footer);
            border: 1px solid var(--vert-olive);
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
            z-index: 10;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
        }

        .lang-dropdown a {
            display: block;
            color: var(--blanc);
            padding: 8px 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .lang-dropdown a:hover {
            background-color: var(--vert-olive);
        }

        .lang-container:hover .lang-dropdown,
        .lang-container:focus-within .lang-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .main-container {
            display: flex;
            flex: 1;
            padding: 40px 50px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            padding-right: 40px;
            flex-shrink: 0;
        }

        .sidebar a {
            color: var(--blanc);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            opacity: 0.6;
            transition: opacity 0.2s, color 0.2s, padding-left 0.2s;
            white-space: nowrap;
        }

        .sidebar a:hover, .sidebar a.active-link {
            opacity: 1;
            color: var(--vert-olive-clair);
            padding-left: 4px;
        }

        .divider {
            width: 2px;
            min-width: 2px;
            background-color: rgba(242, 243, 245, 0.15);
            align-self: stretch;
            margin-bottom: 40px;
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            min-width: 0;
            padding-left: 40px;
            animation: fadeIn 0.4s ease-out;
        }

        .content-area h1 {
            font-size: 34px;
            color: var(--vert-olive-clair);
            margin-bottom: 10px;
            font-weight: 800;
        }

        .content-area h2 {
            font-size: 26px;
            margin-top: 35px;
            margin-bottom: 15px;
            color: var(--vert-olive-clair);
            border-bottom: 1px solid rgba(242, 243, 245, 0.15);
            padding-bottom: 5px;
        }

        .content-area h3 {
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            color: var(--blanc);
        }

        .content-area p {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.85;
        }

        ol, ul {
            padding-left: 20px;
            margin: 20px 0;
        }

        ol li, ul li {
            margin-bottom: 10px;
            font-size: 16px;
            opacity: 0.85;
        }

        ul {
            list-style-type: disc;
        }

        code {
            background-color: var(--gris-code);
            padding: 3px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            color: #ffffff;
            font-weight: bold;
        }

        a {
            color: var(--vert-olive-clair);
            text-decoration: underline;
        }

        a:hover {
            color: var(--vert-olive);
        }

        .note {
            background-color: var(--note-bg);
            border-left: 5px solid var(--vert-olive);
            padding: 15px;
            margin-top: 25px;
            border-radius: 4px;
            color: #ffffff;
        }

        .note strong {
            color: var(--vert-olive-clair);
        }

        footer {
            background-color: var(--gris-footer);
            padding: 25px 50px;
            width: 100%;
            margin-top: auto;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            font-size: 14px;
            opacity: 0.7;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-links a {
            color: var(--blanc);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--vert-olive-clair);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .main-container {
                flex-direction: column;
                padding: 20px;
            }

            .sidebar {
                width: 100%;
                padding-right: 0;
                padding-bottom: 20px;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }

            .divider {
                width: 100%;
                height: 2px;
                margin-bottom: 20px;
            }

            .content-area {
                padding-left: 0;
            }

            .footer-content {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/en" class="logo-container" id="logo-routing">
            <img src="https://raw.githubusercontent.com/kanooob/logoto-web/refs/heads/main/icon.png" alt="Logoto Logo" class="logo-img">
            <div class="logo-text">Logoto</div>
        </a>
        
        <nav aria-label="Language selection">
            <div class="nav-right">
                <div class="lang-container">
                    <button class="lang-select" id="lang-btn" aria-label="Change language. Current language: English">EN ↓</button>
                    <div class="lang-dropdown">
                        <a href="#" id="lang-switch-btn">FR</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar-menu">
            <a href="#tos" id="menu-tos">Terms of Service</a>
            <a href="#privacy" id="menu-privacy">Privacy Policy</a>
        </aside>

        <div class="divider"></div>

        <main class="content-area" id="doc-content">
            <!-- Dynamically injected via JavaScript -->
        </main>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; <span id="year"></span> Logoto. All rights reserved.</p>
            <div class="footer-links">
                <a href="https://github.com/kanooob/Logoto" target="_blank" rel="noopener noreferrer">Source Code</a>
            </div>
        </div>
    </footer>

    <script>
        const legalData = {
            tos: {
                title: "Terms of Service (ToS)",
                html: `
                    <p style="color: #99aab5; font-size: 14px; margin-bottom: 20px;">Last updated: July 11, 2026</p>
                    <h2>1. Acceptance of Terms</h2>
                    <p>Welcome to Logoto, a service provided by independent developer Galaxie_S9. By adding and using the Logoto bot on your Discord server, you agree to be bound by these Terms of Service ("ToS"). If you do not agree to these terms, please do not use the Bot.</p>
                    
                    <h2>2. Description of Service</h2>
                    <p>Logoto is a Discord bot built for automation. Its primary function is to allow server administrators to automatically change their Discord server's logo and/or name at scheduled times, configured via slash commands (such as <code>/setup</code> and <code>/add-an-event</code>).</p>
                    
                    <h2>3. User Commitments</h2>
                    <p>The user agrees to abide by the following rules when using Logoto:</p>
                    <ol>
                        <li><strong>Discord Compliance:</strong> The use of Logoto must strictly comply with <a href="https://discord.com/terms" target="_blank" rel="noopener noreferrer">Discord's Terms of Service</a> and <a href="https://discord.com/guidelines" target="_blank" rel="noopener noreferrer">Discord's Community Guidelines</a>.</li>
                        <li><strong>Permissions:</strong> The user warrants that they possess the required permissions (Manage Server) to configure Logoto.</li>
                        <li><strong>Content:</strong> It is strictly forbidden to use Logoto to schedule logos or server names that are illegal, offensive, hateful, or infringe upon copyrights.</li>
                        <li><strong>Service Abuse:</strong> Command spamming or any attempts to disrupt the stability of the infrastructure is prohibited.</li>
                    </ol>

                    <h2>4. Intellectual Property</h2>
                    <ol>
                        <li><strong>Logoto Code:</strong> The source code of Logoto is the property of Galaxie_S9 and is distributed under the MIT license on <a href="https://github.com/kanooob/Logoto" target="_blank" rel="noopener noreferrer">GitHub</a>.</li>
                        <li><strong>User Content:</strong> Logos and server names remain the exclusive property of their respective authors. Logoto claims no ownership over your images or text.</li>
                    </ol>

                    <h2>5. Limitation of Liability and Hosting</h2>
                    <p><strong>Logoto is provided "as is" without warranties of any kind.</strong> As an independent project, 100% uptime and availability cannot be guaranteed.</p>
                    <p>The Bot's operations directly depend on the <strong>Render</strong> cloud hosting platform. Consequently, scheduled tasks may be affected or delayed by free environment sleep cycles, restarts, or service outages beyond our control. We shall not be held liable for any delays or errors in automatically applying scheduled changes. The user uses the Bot at their own risk.</p>

                    <h2>6. Modifications and Termination</h2>
                    <p>We reserve the right to modify these Terms at any time. Continued use of the Bot constitutes acceptance of the updated Terms. We may remove the bot from any server without prior notice in the event of a breach of these Terms or Discord's guidelines.</p>
                    
                    <h2>7. Contact</h2>
                    <p>For any questions regarding these legal documents, please contact us at: <a href="mailto:galaxies9@duck.com">galaxies9@duck.com</a>.</p>
                `
            },
            privacy: {
                title: "Privacy Policy",
                html: `
                    <p style="color: #99aab5; font-size: 14px; margin-bottom: 20px;">Last updated: July 11, 2026</p>
                    <p>This Privacy Policy describes the types of information that the Logoto Discord Bot ("the Service") collects, how this information is used, and the steps taken to ensure its protection. The service is provided by independent developer Galaxie_S9.</p>

                    <h2>1. Information Collection and Use</h2>
                    <p>Logoto is a bot focused on functionality and data minimization. We only process and retain information strictly necessary to provide the automation and scheduling service.</p>
                    
                    <h3>Types of Data Collected:</h3>
                    <ul>
                        <li><strong>Server Identifiers (Guild IDs):</strong> Your Discord server's unique ID is processed to associate your server with its event schedule configurations.</li>
                        <li><strong>Event Configurations (Names & Image URLs):</strong> When you use the <code>/add-an-event</code> command, the new scheduled server name and/or provided logo image link are processed.</li>
                        <li><strong>User Identifiers (User IDs):</strong> The unique ID of the user executing a command is checked temporarily to ensure they have the required administrative permissions.</li>
                    </ul>

                    <div class="note">
                        <strong>Logoto does NOT store:</strong> Private messages, text channel chat content, user IP addresses, full member history, or any sensitive personal data.
                    </div>

                    <h2>2. Purpose of Data Processing</h2>
                    <p>The collected information is used exclusively to operate the Logoto service, send activity logs directly to your <code>log-logoto</code> channel, and ensure technical troubleshooting.</p>

                    <h2>3. Information Sharing</h2>
                    <p>We do not sell, trade, or rent your configurations. The data transits through <strong>Discord</strong> and is processed safely on the <strong>Render</strong> hosting platform infrastructure.</p>

                    <h2>4. Data Retention and Deletion</h2>
                    <p>Configuration data is retained as long as the Logoto Bot is present on your server. If you remove the Bot, the corresponding event triggers data deletion. Free cloud environments on Render may occasionally reset non-persistent temporary storage files.</p>

                    <h2>5. GDPR Compliance (EU Residents)</h2>
                    <p>If you are a resident of the European Economic Area (EEA), you have rights to access, rectify, and erase configuration data, or withdraw consent at any time by kicking the bot.</p>

                    <h2>6. Data Security</h2>
                    <p>We implement technical security measures to protect configurations. However, no method of transmission over the Internet or electronic storage can be guaranteed 100% secure.</p>

                    <h2>7. Contact</h2>
                    <p>For any questions or requests regarding this Privacy Policy, please contact us at our dedicated email address: <a href="mailto:galaxies9@duck.com">galaxies9@duck.com</a>.</p>
                `
            }
        };

        function updateLayoutAndContent() {
            let currentHash = window.location.hash.substring(1);
            if (currentHash !== 'tos' && currentHash !== 'privacy') {
                currentHash = 'tos';
            }

            const langSwitchBtn = document.getElementById('lang-switch-btn');
            langSwitchBtn.setAttribute('href', `/fr/legal#${currentHash}`);

            document.querySelectorAll('#sidebar-menu a').forEach(el => el.classList.remove('active-link'));
            document.getElementById(`menu-${currentHash}`).classList.add('active-link');

            const contentArea = document.getElementById('doc-content');
            const data = legalData[currentHash];
            contentArea.innerHTML = `<h1>${data.title}</h1>${data.html}`;
        }

        window.addEventListener("hashchange", updateLayoutAndContent);
        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById('year').textContent = new Date().getFullYear();
            updateLayoutAndContent();
        });
    </script>
</body>
</html>
